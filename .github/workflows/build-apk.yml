name: Build Android APK (RPC fullscreen)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK packages
        run: |
          MANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort -V | tail -1)"
          if [ -z "$MANAGER" ]; then echo "Android sdkmanager not installed" >&2; exit 1; fi
          for attempt in 1 2 3 4; do
            if "$MANAGER" --sdk_root="$ANDROID_SDK_ROOT" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" \
              && test -s "$ANDROID_SDK_ROOT/ndk/27.2.12479018/source.properties"; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then echo "::error::NDK download failed"; exit 1; fi
            sleep $((attempt * 5))
          done

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96'
          targets: aarch64-linux-android

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Export Slot keycap graphics
        run: |
          cargo run --locked -p slot-ui --example export_apps_legend -- android/app/src/main/assets/apps_controls
          test -s android/app/src/main/assets/apps_controls/move.png

      - name: Build mGBA arm64 core
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          bash scripts/build-mgba-android.sh

      - name: Build gpSP arm64 core
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          bash scripts/build-gpsp-android.sh

      - name: Checkout upstream Slot (needed by Cart Studio)
        uses: actions/checkout@v4
        with:
          repository: BrandonKowalski/slot
          ref: 34ac38031fd903eb2a0a0157f1dea4d3a5546195
          path: studio-upstream/slot

      - name: Stage Cart Studio sources
        run: |
          set -euo pipefail
          cp -a third_party/slot-cart-studio studio-upstream/slot-cart-studio
          printf '\n[workspace]\n' >> studio-upstream/slot-cart-studio/Cargo.toml

      - name: Install wasm-pack
        run: |
          rustup target add wasm32-unknown-unknown --toolchain 1.96.0
          curl -fsSL https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/wasm-pack-v0.15.0-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"

      - name: Build and package Cart Studio
        run: |
          set -euo pipefail
          (cd studio-upstream/slot-cart-studio && \
            wasm-pack build --release --target web --no-typescript --out-dir web/pkg)
          python3 scripts/package-konkr-cart-studio.py \
            --source . --built studio-upstream/slot-cart-studio/web
          test -s android/app/src/main/assets/studio/pkg/slot_cart_studio_bg.wasm

      # Signing key: use the repo secrets if you set them, otherwise make one
      # and keep it in the Actions cache so every build is signed by the same
      # key and can be installed over the previous one.
      - name: Restore signing key cache
        id: keycache
        uses: actions/cache@v4
        with:
          path: signing
          key: slot-rpc-signing-v1

      - name: Prepare signing key
        env:
          SECRET_KEYSTORE: ${{ secrets.SLOT_KEYSTORE_BASE64 }}
          SECRET_STORE_PASS: ${{ secrets.SLOT_SIGNING_STORE_PASSWORD }}
          SECRET_ALIAS: ${{ secrets.SLOT_SIGNING_KEY_ALIAS }}
          SECRET_KEY_PASS: ${{ secrets.SLOT_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$SECRET_KEYSTORE" ]; then
            (umask 077; printf '%s' "$SECRET_KEYSTORE" | base64 -d > "$RUNNER_TEMP/slot.jks")
            echo "SLOT_SIGNING_STORE_FILE=$RUNNER_TEMP/slot.jks" >> "$GITHUB_ENV"
            echo "SLOT_SIGNING_STORE_PASSWORD=$SECRET_STORE_PASS" >> "$GITHUB_ENV"
            echo "SLOT_SIGNING_KEY_ALIAS=$SECRET_ALIAS" >> "$GITHUB_ENV"
            echo "SLOT_SIGNING_KEY_PASSWORD=$SECRET_KEY_PASS" >> "$GITHUB_ENV"
          else
            mkdir -p signing
            if [ ! -s signing/slot.jks ]; then
              openssl rand -hex 16 > signing/pass.txt
              keytool -genkeypair -keystore signing/slot.jks -storetype PKCS12 \
                -storepass "$(cat signing/pass.txt)" -keypass "$(cat signing/pass.txt)" \
                -alias slot -keyalg RSA -keysize 2048 -validity 36500 \
                -dname "CN=slot rpc build"
            fi
            echo "SLOT_SIGNING_STORE_FILE=$PWD/signing/slot.jks" >> "$GITHUB_ENV"
            echo "SLOT_SIGNING_STORE_PASSWORD=$(cat signing/pass.txt)" >> "$GITHUB_ENV"
            echo "SLOT_SIGNING_KEY_ALIAS=slot" >> "$GITHUB_ENV"
            echo "SLOT_SIGNING_KEY_PASSWORD=$(cat signing/pass.txt)" >> "$GITHUB_ENV"
          fi

      - name: Save signing key cache
        if: steps.keycache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: signing
          key: slot-rpc-signing-v1

      - name: Build signed release APK
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          bash scripts/build-konkr-android.sh
          gradle --no-daemon -p android :app:assembleRelease

      - name: Check APK
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | head -3
          unzip -Z -1 "$APK" | grep -Fx "lib/arm64-v8a/libslot_android.so"
          cp "$APK" slot-rpc-fullscreen-arm64.apk
          sha256sum slot-rpc-fullscreen-arm64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: slot-rpc-fullscreen-arm64
          path: slot-rpc-fullscreen-arm64.apk
          if-no-files-found: error
